[package]
name = "shinki-emu-kirikiroid2-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[features]
default = []
static = []

[lib]
crate-type = ["rlib"]

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "828768456fc67c26e72f0874814d4e908994d88b" }
shinki-kirikiroid2-web-android-host = { path = "android-host" }
serde_json = "1"
shlex = "1"

[workspace]
members = ["android-host"]

[package.metadata.shinki]
upstream = "https://github.com/fenghengzhi/kirikiroid2-web"
upstream_revision = "2028cbccaa91498bd36f270d349ae711d0e8fed3"
hosted_fork = "https://github.com/Project-Shinkirou/kirikiroid2-web"
hosted_fork_branch = "shinki"
